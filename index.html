<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){var v=localStorage.getItem('theme_vars');if(v)try{var s=JSON.parse(v),r=document.documentElement;for(var k in s)r.style.setProperty(k,s[k])}catch(e){}})();</script>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div>
        <h1><a href="index.html">~/blog</a></h1>
        <p class="subtitle">thoughts, code, stories</p>
      </div>
    </header>

    <div class="index-layout">
      <aside class="tag-sidebar">
        <h2>Tags</h2>
        <div class="tag-list" id="tag-list"></div>
      </aside>

      <main>
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search posts..." class="input-full">
        </div>
        <div class="post-list" id="post-list"></div>
        <div class="pagination">
          <button id="page-prev" class="btn" style="display:none;">&larr; Prev</button>
          <span id="page-info" class="page-info"></span>
          <button id="page-next" class="btn" style="display:none;">Next &rarr;</button>
        </div>
      </main>
    </div>

    <footer class="site-footer">
      <p><a href="rss.xml">RSS</a></p>
      <p>built with html &amp; persistence</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
