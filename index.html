<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1><a href="index.html">~/blog</a></h1>
      <p class="subtitle">thoughts, code, stories</p>
    </header>

    <div class="index-layout">
      <aside class="tag-sidebar">
        <h2>Tags</h2>
        <div class="tag-list" id="tag-list"></div>
      </aside>

      <main>
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search posts..." class="input-full">
        </div>
        <div class="post-list" id="post-list"></div>
        <div class="pagination">
          <button id="page-prev" class="btn" style="display:none;">&larr; Prev</button>
          <span id="page-info" class="page-info"></span>
          <button id="page-next" class="btn" style="display:none;">Next &rarr;</button>
        </div>
      </main>
    </div>

    <footer class="site-footer">
      <p>built with html &amp; persistence</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
