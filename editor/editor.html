<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write - Blog</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1><a href="../index.html">~/blog</a></h1>
    </header>

    <!-- Token Section -->
    <section id="token-section" class="editor-card">
      <h2>连接 GitHub</h2>
      <p class="hint">输入 Fine-grained Personal Access Token，需要 Contents: Read and write 权限。</p>
      <div class="form-row">
        <input type="password" id="token" placeholder="github_pat_..." class="input-full">
        <button id="save-token" class="btn">验证</button>
      </div>
      <div id="token-status" class="status-msg"></div>
    </section>

    <!-- Editor Section -->
    <section id="editor-section" class="editor-card" style="display:none;">
      <div class="editor-header">
        <h2>写文章</h2>
        <div class="editor-meta">
          <span>登录为 <strong id="user-display"></strong></span>
          <button id="logout-btn" class="btn-link">切换账号</button>
        </div>
      </div>

      <div class="form-group">
        <label>标题</label>
        <input type="text" id="title" placeholder="文章标题" class="input-full">
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Slug (URL 路径)</label>
          <input type="text" id="slug" placeholder="自动生成" class="input-full">
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="date" class="input-full">
        </div>
      </div>

      <div class="form-group">
        <label>标签（逗号分隔）</label>
        <input type="text" id="tags" placeholder="标签1, 标签2, 标签3" class="input-full">
      </div>

      <div class="form-group">
        <label>摘要</label>
        <input type="text" id="summary" placeholder="一句话描述" class="input-full">
      </div>

      <div class="form-group">
        <label>正文（Markdown）</label>
        <textarea id="content" rows="20" placeholder="在这里写 Markdown..." class="input-full"></textarea>
      </div>

      <div class="form-actions">
        <button id="publish-btn" class="btn btn-primary">发布</button>
        <button id="preview-btn" class="btn">预览</button>
        <div id="publish-status" class="status-msg"></div>
      </div>

      <div id="preview" class="post-content" style="display:none;"></div>
    </section>

    <footer class="site-footer">
      <p>built with html &amp; persistence</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="js/github.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
