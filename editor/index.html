<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage - Blog</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1><a href="/index.html">~/blog</a></h1>
    </header>

    <section id="token-section" class="editor-card">
      <h2>连接 GitHub</h2>
      <p class="hint">输入 Fine-grained Personal Access Token，需要 Contents: Read and write 权限。</p>
      <div class="form-row">
        <input type="password" id="token" placeholder="github_pat_..." class="input-full">
        <button id="save-token" class="btn">验证</button>
      </div>
      <div id="token-status" class="status-msg"></div>
    </section>

    <section id="manage-section" class="editor-card" style="display:none;">
      <div class="editor-header">
        <h2>文章管理</h2>
        <div class="editor-meta">
          <span>登录为 <strong id="user-display"></strong></span>
          <a href="/editor/write.html" class="btn">写文章</a>
          <button id="refresh-posts" class="btn">刷新</button>
          <button id="logout-btn" class="btn-link">切换账号</button>
        </div>
      </div>
      <div id="post-list-status" class="status-msg"></div>
      <div id="post-list" class="post-list-manage"></div>
      <div class="pagination" id="pagination-controls" style="display:none;">
        <button id="page-prev" class="btn">上一页</button>
        <span id="page-info" class="page-info"></span>
        <button id="page-next" class="btn">下一页</button>
      </div>
    </section>

    <footer class="site-footer">
      <p>built with html &amp; persistence</p>
    </footer>
  </div>

  <script src="/editor/js/github.js"></script>
  <script src="/editor/js/manage.js"></script>
</body>
</html>
